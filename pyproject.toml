[project]
name = "py_esproxy"
version = "0.1.0"
description = "Elasticsearch proxy"
authors = [
    {name = "Arnaud Valmary"}
]
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
repository = "https://github.com/ArnaudValmary/py_esproxy"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = "0.141.1"
uvicorn="0.52.4"
#httpx = "0.28.1"
elasticsearch = {extras = ["async"], version = "8.19.3"}
python-dotenv ="1.2.3"

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
flake8 = "7.3.0"
pep8-naming = "0.15.1"
autopep8 = "2.3.2"
isort = "9.0.1"

[tool.poetry.group.test]
optional = true
[tool.poetry.group.test.dependencies]
pytest = "9.1.1"
pytest-cov = "7.1.0"

# [tool.poetry.group.docs]
# optional = true
# [tool.poetry.group.docs.dependencies]
# mkdocs = "*"

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "tests"
]